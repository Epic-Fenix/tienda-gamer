<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Mando de videojuego con lupa buscando">
  <defs>
    <radialGradient id="glow" cx="62%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#12313a"/>
      <stop offset="55%" stop-color="#0a1016"/>
      <stop offset="100%" stop-color="#08080c"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#e11d8f"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#glow)"/>

  <g stroke="#22d3ee" stroke-width="1" opacity="0.10">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200"/>
    <path d="M200 0 V600 M400 0 V600 M600 0 V600 M800 0 V600 M1000 0 V600"/>
  </g>

  <g opacity="0.9">
    <circle cx="250" cy="120" r="4" fill="#22d3ee"/>
    <circle cx="1090" cy="470" r="5" fill="#e11d8f"/>
    <circle cx="980" cy="90" r="3" fill="#fcd34d"/>
    <circle cx="180" cy="470" r="3" fill="#22d3ee"/>
    <path d="M1120 150 l6 0 M1123 147 l0 6" stroke="#fcd34d" stroke-width="3" stroke-linecap="round"/>
    <path d="M150 300 l6 0 M153 297 l0 6" stroke="#e11d8f" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g transform="translate(690 360) rotate(-8)" filter="url(#soft)">
    <rect x="-150" y="-70" width="300" height="150" rx="70" fill="#141420" stroke="#2b2b3a" stroke-width="3"/>
    <circle cx="-150" cy="5" r="62" fill="#141420" stroke="#2b2b3a" stroke-width="3"/>
    <circle cx="150" cy="5" r="62" fill="#141420" stroke="#2b2b3a" stroke-width="3"/>
    <g stroke="#22d3ee" stroke-width="9" stroke-linecap="round">
      <path d="M-92 -8 h44 M-70 -30 v44"/>
    </g>
    <circle cx="70" cy="-24" r="11" fill="#e11d8f"/>
    <circle cx="104" cy="6" r="11" fill="#fcd34d"/>
    <circle cx="70" cy="36" r="11" fill="#22d3ee"/>
    <circle cx="36" cy="6" r="11" fill="#22d3ee"/>
  </g>

  <g transform="translate(905 250)" filter="url(#soft)">
    <circle cx="0" cy="0" r="118" fill="#08131a" fill-opacity="0.7" stroke="url(#neon)" stroke-width="12"/>
    <circle cx="0" cy="0" r="118" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.5"/>
    <path d="M-34 -40 a54 54 0 0 1 40 -20" stroke="#bffaff" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.7"/>
    <text x="0" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="120" fill="url(#neon)">?</text>
    <rect x="78" y="78" width="150" height="34" rx="17" transform="rotate(45 78 78)" fill="url(#neon)"/>
  </g>
